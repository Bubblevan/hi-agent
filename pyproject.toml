[project]
name = "hi-agent"
version = "0.1.0"
description = "A self-learning Agent and RAG implementation based on Hello Agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dashscope>=1.25.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.0",
    "mcp>=2.0.0,<3",
    "neo4j>=5.28.0",
    "openai>=1.68.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.7.0,<3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.14.0",
    "tavily-python>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not real_llm'"
markers = [
    "real_llm: invokes a real external LLM provider and is disabled by default",
]

[tool.uv]
default-groups = ["dev"]
